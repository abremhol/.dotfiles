set -g default-terminal "tmux-256color"
set -s escape-time 0

unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Settings for merging vim statusbar with tmux (tpipe)
# set -g status-style 'bg=default'
# set -g status-left-length 90
# set -g status-right-length 90
# set -g status-justify centre
# set -g status-left '#[fg=green,bold][#S]#[default] '
# set -g status-right '#(exec tmux ls| cut -d " " -f 1-3 |tr "\n" "," )'

# Cross-session bell monitoring (triggered by Copilot's beep on input prompts)
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
setw -g monitor-bell on
set -g bell-action any

# clock mode
setw -g clock-mode-colour yellow

# copy mode
setw -g mode-style 'fg=black bg=red bold'

# panes
set -g pane-border-style 'fg=red'
set -g pane-active-border-style 'fg=yellow'

# statusbar
set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=red'

set -g status-left ''
set -g status-left-length 10

set -g status-right-style 'fg=black bg=yellow'
set -g status-right '%Y-%m-%d %H:%M '
set -g status-right-length 80

setw -g window-status-current-style 'fg=black bg=red'
setw -g window-status-current-format ' #I #W #F '

setw -g window-status-style 'fg=red bg=black'
setw -g window-status-format ' #I #[fg=white]#W #[fg=yellow]#F '

setw -g window-status-bell-style 'fg=yellow bg=red bold'

# messages
set -g message-style 'fg=yellow bg=red bold'

# Easy config reload
bind r source-file ~/.tmux.conf
set -g base-index 1

# mouse behavior
setw -g mouse on

# vi is good
setw -g mode-keys vi
set -g set-clipboard on
# Copy to clipboard using xclip
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"

# Mouse drag to copy to clipboard
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"
# vim-like pane switching
bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# switch to next active session when last pane is destroyed instead of closing tmux
set-option -g detach-on-destroy off

#open new window in current directory
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

#for neovim check health
set-option -sg escape-time 10
set-option -g focus-events on
set-option -g default-terminal "tmux-256color"

# to fix numbering after killing a window
set-option -g renumber-windows on

#Personal project bindings
bind-key -r i run-shell "tmux neww tmux-cht.sh"
bind-key -r V run-shell "~/.local/bin/tmux-sessionizer ~/.config/nvim"
bind -r T neww -c "#{pane_current_path}" "[[ -e TODO.md ]] && nvim TODO.md || nvim ~/.dotfiles/personal/todo.md"

#Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @yank_selection_mouse 'clipboard'
set -g @continuum-restore 'on'
run '~/.tmux/plugins/tpm/tpm'

# Append Copilot bell alerts to status-right (runs after TPM)
run-shell "~/.local/bin/tmux-append-alert.sh"
